# ==============================================================================
# Собственные библиотеки темы Base11 (extensions & helpers)
# ==============================================================================

# Базовые JavaScript-утилиты и вспомогательные функции темы
helper:
  version: VERSION
  js:
    js/helper.js: {}
  dependencies:
    - core/drupal

# Кнопка копирования текста / артикулов / промокодов в буфер обмена с уведомлением
click-to-copy:
  version: VERSION
  css:
    component:
      css/extensions/click-to-copy.css: {}
  js:
    js/extensions/click-to-copy.js: {}
  dependencies:
    - core/drupal
    - core/once

# Плавающая кнопка «Наверх» с плавным скроллом и появлением при прокрутке страницы
back-to-top:
  version: VERSION
  css:
    component:
      css/extensions/back-to-top.css: {}
  js:
    js/extensions/back-to-top.js: {}
  dependencies:
    - core/drupal
    - core/once

# Адаптивное мобильное меню (шторка/панель) с поддержкой свайп-жестов
menu-mobile:
  version: VERSION
  js:
    js/menu-mobile.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
    - base11/swipe-events

# Двусторонняя синхронизация основного слайдера Swiper с блоком миниатюр (превью)
swiper-thumbs:
  version: VERSION
  js:
    js/swiper-thumbs.js: {}
  dependencies:
    - core/drupal
    - core/once
    - swiper_formatter/local
    - swiper_formatter/swiper_formatter

# Переключаемые интерактивные вкладки (табы) на чистом Vanilla JS
tabs-js:
  version: VERSION
  css:
    component:
      css/extensions/tabs-js.css: {}
  js:
    js/extensions/tabs-js.js: {}
  dependencies:
    - core/drupal
    - core/once

# Библиотека распознавания touch-свайпов (влево, вправо, вверх, вниз) на сенсорных экранах
swipe-events:
  version: VERSION
  js:
    js/swipe-events.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings

# Мобильная подложка (backdrop), стили и поведение фасетных фильтров (модуль Facets)
facet-extension:
  version: VERSION
  css:
    component:
      css/extensions/facet-extension.css: {}
  js:
    js/extensions/facet-extension.js: {}
  dependencies:
    - core/drupal
    - core/once

# Живой поиск и фильтрация чекбоксов внутри длинных списков фасетов
facet-list-filter:
  version: VERSION
  js:
    js/extensions/facet-list-filter.js: {}
  dependencies:
    - core/drupal
    - core/once

# Базовая сетка и стили структуры страниц проектов KCCC
layout-kccc:
  version: VERSION
  css:
    component:
      css/extensions/layout-kccc.css:
        weight: -10

# Полноэкранный лайтбокс (GLightbox v3) с авто-синхронизацией со Swiper и подписями
lightbox:
  version: 3.3.0
  css:
    component:
      /libraries/glightbox/dist/css/glightbox.min.css: { minified: true }
      css/extensions/lightbox.css: {}
  js:
    /libraries/glightbox/dist/js/glightbox.min.js: { minified: true }
    js/extensions/lightbox.js: {}
  dependencies:
    - core/drupal
    - core/once

# Индикатор загрузки (спиннер) внутри нажатой кнопки при AJAX-запросах вместо дефолтного троббера
ajax-spinner:
  version: VERSION
  css:
    component:
      css/extensions/ajax-spinner.css: {}
