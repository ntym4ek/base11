font-montserrat:
  css:
    base:
      fonts/montserrat/montserrat.css: {}

file-upload:
  css:
    component:
      css/extensions/file-upload.css:
        weight: -10
  js:
    js/extensions/file-upload.js: {}
  dependencies:
    - core/drupal
    - core/once

# Всплывающие и встроенные системные сообщения (Toast / Inline)
messages:
  css:
    component:
      css/extensions/messages.css:
        weight: -10
  js:
    js/extensions/messages.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings

# ==============================================================================
# Собственные библиотеки темы Base11 (extensions & helpers)
# ==============================================================================

# Базовые JavaScript-утилиты и вспомогательные функции темы
helper:
  js:
    js/helper.js: {}
  dependencies:
    - core/drupal

# Кнопка копирования текста / артикулов / промокодов в буфер обмена с уведомлением
click-to-copy:
  css:
    component:
      css/extensions/click-to-copy.css: {}
  js:
    js/extensions/click-to-copy.js: {}
  dependencies:
    - core/drupal
    - core/once

# Плавающая кнопка «Наверх» с плавным скроллом и появлением при прокрутке страницы
back-to-top:
  css:
    component:
      css/extensions/back-to-top.css: {}
  js:
    js/extensions/back-to-top.js: {}
  dependencies:
    - core/drupal
    - core/once

# Адаптивное мобильное меню (шторка/панель) с поддержкой свайп-жестов
menu-mobile:
  js:
    js/menu-mobile.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
    - base11/swipe-events

# Двусторонняя синхронизация основного слайдера Swiper с блоком миниатюр (превью)
swiper-thumbs:
  js:
    js/swiper-thumbs.js: {}
  dependencies:
    - core/drupal
    - core/once
    - swiper_formatter/local
    - swiper_formatter/swiper_formatter

# Переключаемые интерактивные вкладки (табы) на чистом Vanilla JS
tabs-js:
  css:
    component:
      css/extensions/tabs-js.css: {}
  js:
    js/extensions/tabs-js.js: {}
  dependencies:
    - core/drupal
    - core/once

# Библиотека распознавания touch-свайпов (влево, вправо, вверх, вниз) на сенсорных экранах
swipe-events:
  js:
    js/swipe-events.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings

# Мобильная подложка (backdrop), стили и поведение фасетных фильтров (модуль Facets)
facet-extension:
  css:
    component:
      css/extensions/facet-extension.css: {}
  js:
    js/extensions/facet-extension.js: {}
  dependencies:
    - core/drupal
    - core/once

# Живой поиск и фильтрация чекбоксов внутри длинных списков фасетов
facet-list-filter:
  js:
    js/extensions/facet-list-filter.js: {}
  dependencies:
    - core/drupal
    - core/once

# Полноэкранный лайтбокс (GLightbox v3) с авто-синхронизацией со Swiper и подписями
lightbox:
  version: 3.3.0
  css:
    component:
      /libraries/glightbox/dist/css/glightbox.min.css: { minified: true }
      css/extensions/lightbox.css: {}
  js:
    /libraries/glightbox/dist/js/glightbox.min.js: { minified: true }
    js/extensions/lightbox.js: {}
  dependencies:
    - core/drupal
    - core/once

# Индикатор загрузки (спиннер) внутри нажатой кнопки при AJAX и стандартной отправке форм
ajax-spinner:
  css:
    component:
      css/extensions/ajax-spinner.css: {}
  js:
    js/extensions/ajax-spinner.js: {}
  dependencies:
    - core/drupal
    - core/once

# Переключатель видимости пароля (показать / скрыть)
password-toggle:
  css:
    component:
      css/extensions/password-toggle.css:
        weight: -10
  js:
    js/extensions/password-toggle.js: {}
  dependencies:
    - core/drupal
    - core/once

# Токенизированное оформление модального окна и виджета Drupal Media Library
media-library:
  css:
    component:
      css/extensions/media-library.css: {}
  dependencies:
    - core/drupal.dialog

# Каркас страниц для дашбордов и порталов отчётности (сайдбар + верхняя панель)
layout-dashboard:
  css:
    layout:
      css/extensions/layout-dashboard.css: {}
  js:
    js/extensions/layout-dashboard.js: {}
  dependencies:
    - core/drupal
    - core/once

# Нативные модальные окна и выезжающие боковые шторки (Drawer) на базе HTML <dialog>
native-dialog:
  css:
    component:
      css/extensions/native-dialog.css: {}
  js:
    js/extensions/native-dialog.js: {}
  dependencies:
    - core/drupal
    - core/once

# Графики Apache ECharts с разрешением CSS-токенов, экспортом PNG и ленивой подгрузкой
echarts:
  version: 5.x
  css:
    component:
      css/extensions/echarts.css: {}
  js:
    /libraries/echarts/dist/echarts.min.js: { minified: true }
    js/extensions/echarts.js: {}
  dependencies:
    - core/drupal
    - core/once

# Интерактивные древовидные таблицы, живой поиск, сортировка и sticky-колонка
table-interactive:
  css:
    component:
      css/extensions/table-interactive.css: {}
  js:
    js/extensions/table-interactive.js: {}
  dependencies:
    - core/drupal
    - core/once

# Панель контекстных фильтров и сегментированные переключатели (.b11-filter-bar / .b11-segmented)
filter-bar:
  css:
    component:
      css/extensions/filter-bar.css: {}
  js:
    js/extensions/filter-bar.js: {}
  dependencies:
    - core/drupal
    - core/once

# Полноэкранный макет инфоэкранов и ТВ-панелей (.b11-kiosk с поддержкой тёмной темы)
layout-kiosk:
  css:
    layout:
      css/extensions/layout-kiosk.css: {}
  js:
    js/extensions/layout-kiosk.js: {}
  dependencies:
    - core/drupal
    - core/once

# Компактная строка поиска с очисткой и живым автокомплитом (.b11-search)
search-bar:
  css:
    component:
      css/extensions/search-bar.css: {}
  js:
    js/extensions/search-bar.js: {}
  dependencies:
    - core/drupal
    - core/once

# Полноэкранный макет страницы технического обслуживания (maintenance-page.html.twig)
maintenance-page:
  css:
    layout:
      css/extensions/maintenance-page.css: {}
