$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Бейдж (Badge)
status: stable
description: Универсальный статусный бейдж / метка на цветовых токенах темы Base11.
variants:
  neutral:
    title: Нейтральный
  primary:
    title: Основной (бренд)
  info:
    title: Информация
  success:
    title: Успех
  warning:
    title: Предупреждение
  danger:
    title: Ошибка / опасность
props:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      title: Текст бейджа
    size:
      type: string
      title: Размер
      default: md
      enum:
        - sm
        - md
    pill:
      type: boolean
      title: Скругление капсулой
      default: false
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Атрибуты
      description: Дополнительные HTML-атрибуты корневого элемента.
