name: Base11
type: theme
version: 1.1.2
description: ''
'base theme': stable9
core_version_requirement: ^11
generator: 'starterkit_theme:11.1.7'

libraries:
  - base11/font-montserrat
  - base11/base
  - base11/messages
  - core/normalize

libraries-override:
  core/internal.jquery_ui:
    css:
      theme:
        assets/vendor/jquery.ui/themes/base/theme.css: false
  core/drupal.dialog:
    css:
      component:
        assets/vendor/jquery.ui/themes/base/dialog.css: false
        assets/vendor/jquery.ui/themes/base/button.css: false

libraries-extend:
  user/drupal.user:
    - base11/user
  core/drupal.dropbutton:
    - base11/dropbutton
  file/drupal.file:
    - base11/file
  core/drupal.progress:
    - base11/progress


regions:
  header: Header
  primary_menu: Primary menu
  secondary_menu: Secondary menu
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  help: Help
  sidebar_first: Left sidebar
  content: Content
  sidebar_second: Right sidebar
  downlighted: Downlighted
  footer: Footer


