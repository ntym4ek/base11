name: Base11
type: theme
version: 1.3.2
description: ''
base theme: false
core_version_requirement: ^11
generator: 'starterkit_theme:11.1.7'

libraries:
  - base11/font-montserrat
  - base11/messages
  - base11/ajax-spinner
  - base11/file-upload
  - core/normalize

libraries-override:
  core/internal.jquery_ui:
    css:
      theme:
        assets/vendor/jquery.ui/themes/base/theme.css: false
  core/drupal.dialog:
    css:
      component:
        assets/vendor/jquery.ui/themes/base/dialog.css: false
        assets/vendor/jquery.ui/themes/base/button.css: false
  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: false
  # Отключаем глобальные стили модуля Webform, которые вызывают утечку стилей (CSS leak)
  # и некорректно меняют поведение базовых элементов Form API ядра (.form-item .container-inline,
  # .form-radios, .form-composite и др.) на всех сторонних формах сайта.
  webform/webform.form:
    css:
      component:
        css/webform.form.css: false


regions:
  header: Header
  primary_menu: Primary menu
  secondary_menu: Secondary menu
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  help: Help
  sidebar_first: Left sidebar
  content: Content
  sidebar_second: Right sidebar
  downlighted: Downlighted
  footer: Footer


